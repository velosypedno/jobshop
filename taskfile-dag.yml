version: '3'

vars:
  DEFAULT_DIR: default-dag
  DEFAULT_CONFIG: "{{.DEFAULT_DIR}}/config.json"
  DEFAULT_ORDER: "{{.DEFAULT_DIR}}/order.json"
  BINARY_NAME: scheduler-dag

tasks:
  setup:
    desc: Copy example configurations and orders to the default directory
    cmds:
      - mkdir -p {{.DEFAULT_DIR}}
      - cp example-dag/config.json {{.DEFAULT_CONFIG}}
      - cp example-dag/order.json {{.DEFAULT_ORDER}}
    status:
      - test -f {{.DEFAULT_CONFIG}}
      - test -f {{.DEFAULT_ORDER}}

  build:
    desc: Build the binary
    cmds:
      - go build -o {{.BINARY_NAME}} cmd/scheduler-dag/main.go

  run:
    desc: Run the application with flags
    summary: |
      Runs the program using named flags.
      Example: task run -- -n my_test_plan
      Example: task run -- -c custom_config.json -o custom_orders.json
    cmds:
      - go run cmd/scheduler-dag/main.go --config {{.CONFIG | default .DEFAULT_CONFIG}} --orders {{.ORDER | default .DEFAULT_ORDER}} {{.CLI_ARGS}}

  help:
    desc: Show CLI help
    cmds:
      - go run cmd/scheduler-dag/main.go --help
